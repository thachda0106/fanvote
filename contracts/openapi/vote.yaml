openapi: 3.1.0
info:
  title: Eventista Vote API
  version: 0.1.0
  description: >
    Voting bounded context: event catalog (PostGIS), ballots, quota,
    leaderboard, SSE live stream. Truth lives here (ADR-0001); leaderboards
    served from Redis counters with the PG ledger as authority (Q-06).
servers:
  - url: /
    description: Through the gateway (phase 1+); direct to pod in dev
tags:
  - name: health
  - name: events
  - name: votes
  - name: leaderboard
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: "Liveness — datastore-independent (Q-15/D-12 class: never depends on Redis/PG)"
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: "Readiness — 503 when degraded (product rule: readiness)"
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Degraded — take this pod out of rotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: RED metrics (Prometheus text exposition) — not routed via gateway (Q-22)
      security: []
      responses:
        "200":
          description: Prometheus exposition
          content:
            text/plain:
              schema: { type: string }
  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events (catalog)
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/near:
    get:
      tags: [events]
      operationId: listEventsNear
      summary: Events within radius of a point — one ST_DWithin + ST_Distance query (T2.5)
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: float, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: float, minimum: -180, maximum: 180 }
        - name: radius_km
          in: query
          required: true
          schema: { type: number, format: float, exclusiveMinimum: 0, maximum: 500 }
      responses:
        "200":
          description: Radius-filtered events ordered by distance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/{eventId}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Event detail
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/{eventId}/votes:
    post:
      tags: [votes]
      operationId: castVote
      summary: Cast the fan's single ballot for this event (re-vote → 409; quota → 429)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastVoteRequest" }
      responses:
        "201":
          description: Ballot accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ballot" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: RE_VOTE_NOT_ALLOWED — UNIQUE (event_id, user_id) is final (Q-27)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: QUOTA_EXCEEDED — 10 points per event per GMT+7 day (Q-26)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/events/{eventId}/votes/me:
    get:
      tags: [votes]
      operationId: getMyQuotaState
      summary: Caller's remaining free points for this event today (GMT+7)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Quota state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/{eventId}/leaderboard:
    get:
      tags: [leaderboard]
      operationId: getLeaderboard
      summary: Leaderboard — counters by default, values must equal the ledger (Q-06)
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: source
          in: query
          required: false
          description: counter (default) | ledger (authority / ops escape hatch)
          schema: { type: string, enum: [counter, ledger], default: counter }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/{eventId}/stream:
    get:
      tags: [leaderboard]
      operationId: streamLeaderboard
      summary: "SSE live leaderboard (G-E: vote owns SSE; fallback = 1s polling)"
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: text/event-stream of LeaderboardUpdate events
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/LeaderboardUpdate" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: UNAUTHORIZED — missing/invalid JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: INTERNAL_ERROR — bugs only; target 0 (ground rule 8)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE — typed 503, metered separately from 5xx bugs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, degraded] }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_FAILED, RE_VOTE_NOT_ALLOWED, QUOTA_EXCEEDED, INTERNAL_ERROR, DEPENDENCY_UNAVAILABLE] }
        message: { type: string }
        requestId: { type: string }
    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: float }
        lon: { type: number, format: float }
    Event:
      type: object
      required: [id, name, votingClosesAt, location]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        votingClosesAt: { type: string, format: date-time }
        location:
          type: object
          required: [point, venueName]
          properties:
            point: { $ref: "#/components/schemas/GeoPoint" }
            venueName: { type: string }
            distanceKm: { type: number, format: float, description: Present on near-query results only }
    EventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        nextCursor: { type: [string, "null"] }
    CastVoteRequest:
      type: object
      required: [candidateId, points]
      properties:
        candidateId: { type: string, format: uuid }
        points:
          type: integer
          minimum: 1
          maximum: 10
          description: Free points allocated; cumulative ≤ 10 per event per GMT+7 day (Q-26)
    Ballot:
      type: object
      required: [eventId, candidateId, points, castAt]
      properties:
        eventId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        points: { type: integer, minimum: 1, maximum: 10 }
        castAt: { type: string, format: date-time }
    QuotaState:
      type: object
      required: [eventId, remainingPoints, windowClosesAt, hasVoted]
      properties:
        eventId: { type: string, format: uuid }
        remainingPoints: { type: integer, minimum: 0, maximum: 10 }
        windowClosesAt: { type: string, format: date-time, description: Next 00:00 GMT+7 }
        hasVoted: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [candidateId, candidateName, points, rank]
      properties:
        candidateId: { type: string, format: uuid }
        candidateCode: { type: string }
        candidateName: { type: string }
        points: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
    Leaderboard:
      type: object
      required: [eventId, source, entries]
      properties:
        eventId: { type: string, format: uuid }
        source: { type: string, enum: [counter, ledger] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        updatedAt: { type: string, format: date-time }
    LeaderboardUpdate:
      type: object
      required: [eventId, entries, updatedAt]
      properties:
        eventId: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        updatedAt: { type: string, format: date-time }