server:
  port: 8081
  # Run with -Duser.timezone=UTC (T0.6 / README) — quota windows are GMT+7
  # business-wise but all storage timestamps are UTC.

spring:
  application:
    name: commerce
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"

logging:
  # JSON encoder config lives in logback-spring.xml (T1.6); correlation id is
  # injected by ObservabilityFilter, trace ids by the OTel Java agent.
  level:
    root: INFO
