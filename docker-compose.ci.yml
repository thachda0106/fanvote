# Slim CI profile (review finding B4 — GH runner ~7 GB):
# 1 Kafka broker (replication factor 1), no Jaeger, datastores + services.
name: eventista2-ci

services:
  pg-vote:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eventista
      POSTGRES_PASSWORD: eventista
      POSTGRES_DB: vote
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventista -d vote"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventista
      POSTGRES_PASSWORD: eventista
      POSTGRES_DB: commerce
    ports:
      - "55433:5432"
    volumes:
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventista -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7.0
    ports:
      - "57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-0:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: "eventista2cicluster1"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-0:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  identity:
    build: ./services/identity
    environment: { PORT: "3001" }
    ports: ["3011:3001"]
    depends_on:
      pg-app: { condition: service_healthy }

  voting:
    build: ./services/voting
    environment: { PORT: "3002" }
    ports: ["3002:3002"]
    depends_on:
      pg-vote: { condition: service_healthy }
      redis: { condition: service_healthy }

  commerce:
    build: ./services/commerce
    ports: ["8081:8081"]
    depends_on:
      pg-app: { condition: service_healthy }

  analytics:
    build: ./services/analytics
    ports: ["8001:8001"]
    depends_on:
      mongo: { condition: service_healthy }
